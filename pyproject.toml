[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bingo"
version = "0.1.0"
description = "课堂宾果卡：词表一键生成 A4 可打印宾果卡与叫号单"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["bingo", "classroom", "game", "education", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
bingo = "bingo.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/bingo"
Source = "https://github.com/eastyou/bingo"

[tool.setuptools]
packages = ["bingo"]
