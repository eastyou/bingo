name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test bingo generation
        run: |
          python -m bingo -i examples/单词表.csv --seed 7 --count 4 -o cards.html
          python -m bingo -i examples/单词表.csv --size 3 --count 2 --no-call-sheet -o mini.html
          python -c "print(open('cards.html', encoding='utf-8').read().count('class=' + chr(34) + 'card' + chr(34)))"
          python -c "print(open('cards.html', encoding='utf-8').read().count('叫号单'))"
          python -c "print(open('mini.html', encoding='utf-8').read().count('A4 portrait'))"
